[project]
name = "asr"
version = "0.1.0"
description = "Air-traffic-control speech recognition service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "httpx[socks]>=0.28.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
local = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.46.0",
    "safetensors>=0.4.0",
    "speechbrain>=1.0.0",
    "torch>=2.7.0,<3",
    "torchaudio>=2.7.0,<3",
    "transformers>=4.55.4,<5",
]
benchmark = [
    "datasets>=2.14.0,<4",
    "jiwer>=3.0.0",
    "noisereduce>=3.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "tqdm>=4.66.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'", extra = "local" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'", extra = "local" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
